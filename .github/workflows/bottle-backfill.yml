name: bottle-backfill

# Builds one Homebrew bottle for a release that already exists, without
# retagging it. For when a runner image disappears under a release run, as
# macos-14 did on v0.4.0. Takes the rendered formula from that release run's
# `homebrew-formula` artifact, attaches the bottle to the release, and leaves
# the bottle JSON as an artifact to merge into the tap by hand.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.4.0
        required: true
      run_id:
        description: Id of the release run whose homebrew-formula artifact to use
        required: true
      runner:
        description: Runner image to bottle on
        required: true
        default: macos-15

permissions:
  contents: read

jobs:
  bottle:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebrew-formula
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build the bottle
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          brew tap-new --no-git mhrsntrk/local
          cp landline.rb "$(brew --repository)/Library/Taps/mhrsntrk/homebrew-local/Formula/"
          brew install --build-bottle mhrsntrk/local/landline
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            mhrsntrk/local/landline
          for f in landline--*.bottle.tar.gz; do
            mv "$f" "$(echo "$f" | sed 's/--/-/')"
          done

      - name: Attach the bottle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" landline-*.bottle.tar.gz --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bottle-${{ inputs.runner }}
          path: landline--*.bottle.json
          if-no-files-found: error
