name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS: native build for both Apple Silicon and Intel from one arm64
  # runner. Xcode ships both SDKs, so `rustup target add` is all that's
  # needed for the x86_64 leg — no cross linker setup.
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release -p landlined --target ${{ matrix.target }}

      # TODO(signing): codesign the binary with a Developer ID Application
      # cert, then `xcrun notarytool submit --wait` + `xcrun stapler staple`
      # go here once we have a cert. Unsigned binaries work fine for now;
      # Gatekeeper just warns on first launch.

      - name: Package
        run: |
          set -eu
          out="landlined-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/landlined" "$out"
          shasum -a 256 "$out" > "${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: landlined-${{ matrix.target }}
          path: |
            landlined-${{ matrix.target }}
            landlined-${{ matrix.target }}.sha256
          if-no-files-found: error

  # Linux: both glibc targets cross-compiled from one x86_64 runner via
  # cargo-zigbuild, which swaps in zig's bundled clang/lld + glibc sysroots
  # instead of needing native cross toolchains installed. The `.2.31`
  # target suffix pins the minimum glibc (Ubuntu 20.04's) so the binaries
  # run on older distros too, not just whatever the runner has.
  # Native on both architectures rather than cross-compiled. The previous
  # cargo-zigbuild setup failed the first release outright: setup-zig could not
  # fetch a toolchain, every mirror answered 502/404/503 and the official URL
  # 404'd for the version "latest" resolved to. Building natively removes that
  # dependency entirely, and GitHub's arm64 runners are free for public repos.
  #
  # The trade is the glibc floor. zigbuild pinned 2.31; building on 22.04 links
  # against 2.35, so these binaries need Ubuntu 22.04 or newer. Anything older
  # builds from source.
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release -p landlined

      - name: Package
        run: |
          set -eu
          out="landlined-${{ matrix.target }}"
          cp target/release/landlined "$out"
          sha256sum "$out" > "${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: landlined-${{ matrix.target }}
          path: |
            landlined-${{ matrix.target }}
            landlined-${{ matrix.target }}.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p landlined --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $out = "landlined-x86_64-pc-windows-msvc.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/landlined.exe" $out
          $hashLine = certutil -hashfile $out SHA256 | Select-String -Pattern '^[0-9A-Fa-f]{64}$'
          $hash = $hashLine.Line.Trim().ToLower()
          "$hash  $out" | Out-File -Encoding ascii "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: landlined-x86_64-pc-windows-msvc
          path: |
            landlined-x86_64-pc-windows-msvc.exe
            landlined-x86_64-pc-windows-msvc.exe.sha256
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only, so creating the release 403s
    # with "Resource not accessible by integration". Only this job needs it.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Renders packaging/homebrew/landline.rb from the checksums this release
  # actually published and pushes it to mhrsntrk/homebrew-tap. Hand-editing a
  # formula is the step that silently rots: the SHAs stop matching the binaries
  # and nobody notices until an install fails.
  #
  # Needs a TAP_TOKEN secret (a PAT with contents:write on homebrew-tap).
  # GITHUB_TOKEN cannot reach another repository. Without the secret this job
  # fails and the release itself still stands, so the formula can be updated by
  # hand as a fallback.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the formula from the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for t in aarch64-apple-darwin x86_64-apple-darwin \
                   aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern "landlined-$t.sha256" --dir sums
          done
          sha() { awk '{print $1}' "sums/landlined-$1.sha256"; }
          sed -e "s/__VERSION__/$version/g" \
              -e "s/__SHA_ARM__/$(sha aarch64-apple-darwin)/" \
              -e "s/__SHA_X86__/$(sha x86_64-apple-darwin)/" \
              -e "s/__SHA_LINUX_ARM__/$(sha aarch64-unknown-linux-gnu)/" \
              -e "s/__SHA_LINUX_X86__/$(sha x86_64-unknown-linux-gnu)/" \
              packaging/homebrew/landline.rb > landline.rb
          # A leftover placeholder means a rename went unnoticed upstream.
          ! grep -q "__" landline.rb

      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/mhrsntrk/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp landline.rb tap/Formula/landline.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/landline.rb
          git diff --quiet --cached || git commit -m "landline $version"
          git push

  # Homebrew treats a formula with no bottle as a source build, even though our
  # install only copies an already-compiled binary, and then refuses to run on
  # any machine whose Command Line Tools are out of date. A real user hit
  # exactly that. A bottle installs with no developer tools, and unlike a cask
  # it carries no Gatekeeper quarantine, which matters while these binaries are
  # unsigned.
  #
  # Homebrew falls back to an older OS tag of the same architecture, so
  # bottling the OLDEST runner we support gives the widest coverage. Newer
  # macOS uses an older bottle; the reverse is not true.
  bottle:
    needs: homebrew
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # arm64, Sonoma: covers Sonoma and newer
          - runner: macos-13      # x86_64, Ventura: covers Ventura and newer
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Build the bottle
        run: |
          set -eu
          brew tap mhrsntrk/tap
          brew install --build-bottle mhrsntrk/tap/landline
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            mhrsntrk/tap/landline
          # `brew bottle` writes name--version.tag; the published file drops one
          # dash, and brew looks for the single-dash name at root_url.
          for f in landline--*.bottle.tar.gz; do
            mv "$f" "$(echo "$f" | sed 's/--/-/')"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.runner }}
          path: |
            landline-*.bottle.tar.gz
            landline--*.bottle.json
          if-no-files-found: error

  # Attaches the bottles to the release and merges their checksums into the
  # formula, so the tap and the release agree in one step rather than by hand.
  bottle-publish:
    needs: bottle
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true

      - name: Attach the bottles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            bottles/landline-*.bottle.tar.gz --clobber

      - name: Merge the checksums into the formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mhrsntrk/homebrew-tap.git" tap
          brew tap-new --no-git mhrsntrk/local 2>/dev/null || true
          cp tap/Formula/landline.rb "$(brew --repository)/Library/Taps/mhrsntrk/homebrew-local/Formula/" 2>/dev/null || true
          # `--merge --write` folds every runner's json into one bottle block.
          brew bottle --merge --write --no-commit bottles/landline--*.bottle.json
          cp "$(brew --repository)/Library/Taps/mhrsntrk/homebrew-local/Formula/landline.rb" tap/Formula/landline.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/landline.rb
          git diff --quiet --cached || git commit -m "landline $version: bottles"
          git push
