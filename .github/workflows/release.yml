name: release

on:
  push:
    tags:
      - "v*"

# Least privilege by default: only the jobs that write to the release say so.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS: native build for both Apple Silicon and Intel from one arm64
  # runner. Xcode ships both SDKs, so `rustup target add` is all that's
  # needed for the x86_64 leg — no cross linker setup.
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Deliberately a moving ref: the point of this job is that the code
      # still builds on whatever stable is now. Every other action is pinned
      # to a commit, because a tag can be repointed and `softprops` in
      # particular runs with write access to the release.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release -p landlined --target ${{ matrix.target }}

      # TODO(signing): codesign the binary with a Developer ID Application
      # cert, then `xcrun notarytool submit --wait` + `xcrun stapler staple`
      # go here once we have a cert. Unsigned binaries work fine for now;
      # Gatekeeper just warns on first launch.

      - name: Package
        run: |
          set -eu
          out="landlined-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/landlined" "$out"
          shasum -a 256 "$out" > "${out}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landlined-${{ matrix.target }}
          path: |
            landlined-${{ matrix.target }}
            landlined-${{ matrix.target }}.sha256
          if-no-files-found: error

  # Linux: both glibc targets cross-compiled from one x86_64 runner via
  # cargo-zigbuild, which swaps in zig's bundled clang/lld + glibc sysroots
  # instead of needing native cross toolchains installed. The `.2.31`
  # target suffix pins the minimum glibc (Ubuntu 20.04's) so the binaries
  # run on older distros too, not just whatever the runner has.
  # Native on both architectures rather than cross-compiled. The previous
  # cargo-zigbuild setup failed the first release outright: setup-zig could not
  # fetch a toolchain, every mirror answered 502/404/503 and the official URL
  # 404'd for the version "latest" resolved to. Building natively removes that
  # dependency entirely, and GitHub's arm64 runners are free for public repos.
  #
  # The trade is the glibc floor. zigbuild pinned 2.31; building on 22.04 links
  # against 2.35, so these binaries need Ubuntu 22.04 or newer. Anything older
  # builds from source.
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Deliberately a moving ref: the point of this job is that the code
      # still builds on whatever stable is now. Every other action is pinned
      # to a commit, because a tag can be repointed and `softprops` in
      # particular runs with write access to the release.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release -p landlined --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          out="landlined-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/landlined" "$out"
          # The artifact is named for an architecture; assert it is that one,
          # rather than trusting that the runner matched the matrix entry.
          file "$out"
          case "${{ matrix.target }}" in
            aarch64-*) file "$out" | grep -q "ARM aarch64" ;;
            x86_64-*)  file "$out" | grep -q "x86-64" ;;
          esac
          sha256sum "$out" > "${out}.sha256"

      # The changelog has claimed a .deb since 0.1.0 and nothing ever built
      # one; the `[package.metadata.deb]` block in Cargo.toml was dead. Only
      # x86_64 for now, which is what a Debian or Ubuntu server usually is.
      - name: Package the .deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -eu
          cargo install cargo-deb --locked
          cargo deb -p landlined --no-build --target ${{ matrix.target }} --output landlined.deb
          version="${GITHUB_REF_NAME#v}"
          mv landlined.deb "landlined_${version}_amd64.deb"
          sha256sum "landlined_${version}_amd64.deb" > "landlined_${version}_amd64.deb.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landlined-${{ matrix.target }}
          path: |
            landlined-${{ matrix.target }}
            landlined-${{ matrix.target }}.sha256
            landlined_*_amd64.deb
            landlined_*_amd64.deb.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Deliberately a moving ref: the point of this job is that the code
      # still builds on whatever stable is now. Every other action is pinned
      # to a commit, because a tag can be repointed and `softprops` in
      # particular runs with write access to the release.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo build --release -p landlined --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $out = "landlined-x86_64-pc-windows-msvc.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/landlined.exe" $out
          $hashLine = certutil -hashfile $out SHA256 | Select-String -Pattern '^[0-9A-Fa-f]{64}$'
          $hash = $hashLine.Line.Trim().ToLower()
          "$hash  $out" | Out-File -Encoding ascii "$out.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landlined-x86_64-pc-windows-msvc
          path: |
            landlined-x86_64-pc-windows-msvc.exe
            landlined-x86_64-pc-windows-msvc.exe.sha256
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only, so creating the release 403s
    # with "Resource not accessible by integration". Only this job needs it.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # Re-pushing a tag reruns this whole workflow, and `action-gh-release`
      # would happily replace the assets of a release that already exists. The
      # tap's checksums and any attached bottle still describe the old bytes,
      # so unless the rebuild is byte-identical every `brew install` starts
      # failing its checksum. Cut a new version instead.
      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets | length' 2>/dev/null | grep -qv '^0$'; then
            echo "::error::$GITHUB_REF_NAME already has assets. Re-tagging desynchronizes them from the tap and any bottle. Cut a new version." >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
  # Renders packaging/homebrew/landline.rb from the checksums this release
  # actually published. Hand-editing a formula is the step that silently rots:
  # the SHAs stop matching the binaries and nobody notices until an install
  # fails.
  #
  # Rendering and pushing are separate jobs on purpose. The push needs a PAT
  # for another repository; rendering needs nothing. Keeping them together
  # meant a missing secret skipped every job downstream, so one absent PAT cost
  # the bottles too and every `brew install` fell back to a source build.
  homebrew-formula:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render the formula from the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for t in aarch64-apple-darwin x86_64-apple-darwin \
                   aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern "landlined-$t.sha256" --dir sums
          done
          sha() { awk '{print $1}' "sums/landlined-$1.sha256"; }
          sed -e "s|__VERSION__|$version|g" \
              -e "s|__SHA_ARM__|$(sha aarch64-apple-darwin)|" \
              -e "s|__SHA_X86__|$(sha x86_64-apple-darwin)|" \
              -e "s|__SHA_LINUX_ARM__|$(sha aarch64-unknown-linux-gnu)|" \
              -e "s|__SHA_LINUX_X86__|$(sha x86_64-unknown-linux-gnu)|" \
              -e "/^__BOTTLE_BLOCK__$/d" \
              packaging/homebrew/landline.rb > landline.rb
          # A leftover placeholder means a rename went unnoticed upstream.
          # The bottle block is deliberately not one of them: it is emptied
          # here and written by `bottle-publish` once the bottles exist.
          ! grep -q "__" landline.rb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-formula
          path: landline.rb
          if-no-files-found: error

  # Needs a TAP_TOKEN secret (a PAT with contents:write on homebrew-tap).
  # GITHUB_TOKEN cannot reach another repository. Without the secret this job
  # fails and everything else still stands, so the formula can be pushed by
  # hand as a fallback.
  homebrew-push:
    needs: homebrew-formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebrew-formula

      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -eu
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::TAP_TOKEN is not set; push the rendered formula by hand" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/mhrsntrk/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp landline.rb tap/Formula/landline.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/landline.rb
          git diff --quiet --cached || git commit -m "landline $version"
          git push

  # Homebrew treats a formula with no bottle as a source build, even though our
  # install only copies an already-compiled binary, and then refuses to proceed
  # on any machine whose Command Line Tools are out of date. A real user hit
  # exactly that. A bottle installs with no developer tools, and unlike a cask
  # it carries no Gatekeeper quarantine, which matters while these binaries are
  # unsigned.
  #
  # Homebrew falls back to an older OS tag of the same architecture, so
  # bottling the OLDEST runner we support gives the widest coverage. Newer
  # macOS uses an older bottle; the reverse is not true.
  bottle:
    # Deliberately not `needs: homebrew-push`. The tap push needs a secret that
    # lives outside this repository, and gating the bottles on it meant one
    # missing PAT skipped the whole back half of the release. The formula comes
    # from the artifact and is installed through a local tap instead.
    needs: homebrew-formula
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14         # arm64, Sonoma: covers Sonoma and newer
          - runner: macos-15-intel   # x86_64: covers that OS and newer
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebrew-formula

      - name: Build the bottle
        run: |
          set -eu
          # A local tap, so this does not depend on the push having happened.
          brew tap-new --no-git mhrsntrk/local
          cp landline.rb "$(brew --repository)/Library/Taps/mhrsntrk/homebrew-local/Formula/"
          brew install --build-bottle mhrsntrk/local/landline
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            mhrsntrk/local/landline
          # `brew bottle` writes name--version.tag; the published file drops one
          # dash, and brew looks for the single-dash name at root_url.
          for f in landline--*.bottle.tar.gz; do
            mv "$f" "$(echo "$f" | sed 's/--/-/')"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bottle-${{ matrix.runner }}
          path: |
            landline-*.bottle.tar.gz
            landline--*.bottle.json
          if-no-files-found: error

  # Attaches the bottles to the release and merges their checksums into the
  # formula, so the tap and the release agree in one step rather than by hand.
  bottle-publish:
    needs: bottle
    runs-on: macos-14
    # Uploads the bottles onto the release. Without this the job inherits the
    # read-only default and 403s at the upload, after having built everything.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true

      - name: Attach the bottles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            bottles/landline-*.bottle.tar.gz --clobber

      - name: Merge the checksums into the formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -eu
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::TAP_TOKEN is not set; merge the bottle block by hand" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mhrsntrk/homebrew-tap.git" tap
          brew tap-new --no-git mhrsntrk/local 2>/dev/null || true
          cp tap/Formula/landline.rb "$(brew --repository)/Library/Taps/mhrsntrk/homebrew-local/Formula/"
          # `--merge --write` folds every runner's json into one bottle block.
          brew bottle --merge --write --no-commit bottles/landline--*.bottle.json
          cp "$(brew --repository)/Library/Taps/mhrsntrk/homebrew-local/Formula/landline.rb" tap/Formula/landline.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/landline.rb
          git diff --quiet --cached || git commit -m "landline $version: bottles"
          git push
