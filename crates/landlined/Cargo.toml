[package]
name = "landlined"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
landline-proto.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio.workspace = true
portable-pty = "0.9"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
rpassword = "7"
rand = "0.8"

[features]
harness = []

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util = "0.3"

# cargo-deb packaging metadata; consumed by `cargo deb -p landlined` for the
# Linux .deb build. See packaging/ for the rest of the release pipeline.
[package.metadata.deb]
maintainer = "mhrsntrk <m@mhrsntrk.com>"
extended-description = "Landline host daemon: exposes local PTY sessions over a WebSocket API for the landline iOS app, meant to sit behind `tailscale serve` on the same host. Requires Tailscale to already be installed and running; it is not pulled in as a package dependency."
depends = "libc6"
assets = [
    ["target/release/landlined", "usr/bin/", "755"],
]
