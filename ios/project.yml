name: Landline

options:
  bundleIdPrefix: dev.mhrsntrk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0

targets:
  Landline:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Landline
    dependencies:
      - package: SwiftTerm
    info:
      path: Landline/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "Unlock your hosts."
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # No team on purpose: simulator builds need no signing.
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"

  LandlineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LandlineTests
    dependencies:
      - target: Landline
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Landline:
    build:
      targets:
        Landline: all
        LandlineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LandlineTests
