name: Landline

options:
  bundleIdPrefix: com.landlineclient
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Pinned exactly, not `from:`. `Package.resolved` lives inside the
    # generated .xcodeproj, which is gitignored, so a floating range meant
    # every fresh `xcodegen generate` could resolve a newer SwiftTerm and ship
    # terminal-emulator code nobody had tested, with no diff in the repo to
    # show for it. Bump this line deliberately.
    exactVersion: 1.20.0

targets:
  Landline:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Landline
    dependencies:
      - package: SwiftTerm
    info:
      path: Landline/Info.plist
      properties:
        # Bind the bundle versions to the build settings. xcodegen otherwise
        # bakes literals into the generated Info.plist, so bumping
        # CURRENT_PROJECT_VERSION silently ships the old build number and the
        # upload is rejected as a duplicate.
        #
        # CURRENT_PROJECT_VERSION is still set by hand below. Deriving it from
        # `git rev-list --count HEAD` was considered and rejected: App Store
        # Connect refuses a build number that is not strictly greater than the
        # last one, and a commit count can go down on a rebase or a
        # squash-merge, which would wedge uploads with a rejection whose cause
        # is nowhere near the error. Bump it deliberately.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - JetBrainsMonoNerdFontMono-Regular.ttf
          - JetBrainsMonoNerdFontMono-Bold.ttf
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "Unlock your hosts."
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Signing lives here, never in the Xcode UI: xcodegen regenerates the
        # project from this file, so anything set in Xcode is silently lost.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H5CZC3MTXP
        PRODUCT_BUNDLE_IDENTIFIER: com.landlineclient.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "17"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"

  LandlineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LandlineTests
    dependencies:
      - target: Landline
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Landline:
    build:
      targets:
        Landline: all
        LandlineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LandlineTests
